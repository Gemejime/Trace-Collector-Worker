{{- if .Values.keda.enabled }}
{{- $protocol := include "rag-trace-collector-worker.kafkaSecurityProtocol" . | default "PLAINTEXT" }}
{{- $useTls := or (eq $protocol "SSL") (eq $protocol "SASL_SSL") }}
{{- $useSasl := or (eq $protocol "SASL_PLAINTEXT") (eq $protocol "SASL_SSL") }}
{{- if $useSasl }}
{{- if not (and .Values.keda.triggerAuthentication.enabled .Values.keda.triggerAuthentication.name) }}
{{- fail "keda.triggerAuthentication.enabled and keda.triggerAuthentication.name are required when kafka.securityProtocol uses SASL" }}
{{- end }}
{{- end }}
{{- if and .Values.keda.triggerAuthentication.enabled (not .Values.keda.triggerAuthentication.name) }}
{{- fail "keda.triggerAuthentication.name is required when keda.triggerAuthentication.enabled is true" }}
{{- end }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "rag-trace-collector-worker.fullname" . }}
  labels:
    {{- include "rag-trace-collector-worker.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    {{- if .Values.rollout.enabled }}
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    {{- else }}
    apiVersion: apps/v1
    kind: Deployment
    {{- end }}
    name: {{ include "rag-trace-collector-worker.fullname" . }}
  pollingInterval: {{ .Values.keda.pollingInterval }}
  cooldownPeriod: {{ .Values.keda.cooldownPeriod }}
  minReplicaCount: {{ .Values.keda.minReplicaCount }}
  maxReplicaCount: {{ .Values.keda.maxReplicaCount }}
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: {{ include "rag-trace-collector-worker.kafkaBootstrapServers" . | quote }}
        consumerGroup: {{ include "rag-trace-collector-worker.kafkaGroupId" . | quote }}
        topic: {{ include "rag-trace-collector-worker.kafkaTopic" . | quote }}
        lagThreshold: {{ .Values.keda.lagThreshold | quote }}
        activationLagThreshold: {{ .Values.keda.activationLagThreshold | quote }}
        offsetResetPolicy: {{ include "rag-trace-collector-worker.kafkaAutoOffsetReset" . | quote }}
        {{- if $useTls }}
        tls: "enable"
        {{- end }}
        {{- if $useSasl }}
        {{- $mech := include "rag-trace-collector-worker.kafkaSaslMechanism" . | default "" }}
        {{- if eq $mech "SCRAM-SHA-256" }}
        sasl: "scram_sha256"
        {{- else if eq $mech "SCRAM-SHA-512" }}
        sasl: "scram_sha512"
        {{- else if eq $mech "PLAIN" }}
        sasl: "plaintext"
        {{- else }}
        {{- fail (printf "Unsupported kafka.saslMechanism %q for KEDA Kafka trigger" $mech) }}
        {{- end }}
        {{- end }}
      {{- if and .Values.keda.triggerAuthentication.enabled .Values.keda.triggerAuthentication.name }}
      authenticationRef:
        name: {{ .Values.keda.triggerAuthentication.name | quote }}
      {{- end }}
{{- end }}
