name: CI - rag-trace-collector-worker

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint and typecheck tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]" || pip install -e . || true
          fi

      - name: Run Ruff lint & format check
        run: |
          if find . -maxdepth 3 -name "*.py" | grep -q .; then
            ruff check .
            ruff format --check .
          else
            echo "No Python source files yet (Phase 0); skipping ruff."
          fi

      - name: Run Mypy strict typecheck
        run: |
          if [ -d cmd ] || [ -d internal ]; then
            mypy --strict $(ls -d cmd internal 2>/dev/null)
          else
            echo "No cmd/ or internal/ directories yet (Phase 0); skipping mypy."
          fi

  security-and-logging-audit:
    name: Security & Secured Logging Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security audit tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Run Bandit SAST scan
        run: |
          if [ -d cmd ] || [ -d internal ]; then
            bandit -r $(ls -d cmd internal 2>/dev/null) -ll -ii
          else
            echo "No cmd/ or internal/ directories yet (Phase 0); skipping bandit."
          fi

      - name: Run pip-audit dependency vulnerability check
        run: |
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt
          elif [ -f pyproject.toml ]; then
            pip install -e .
            pip-audit
          else
            echo "No dependency manifest yet (Phase 0); skipping pip-audit."
          fi

      - name: Secured Logging & Secret Hygiene Audit
        run: |
          python - << 'EOF'
          import pathlib, re, sys

          errors = []
          source_dirs = [p for p in [pathlib.Path("cmd"), pathlib.Path("internal")] if p.exists()]
          forbidden_print = re.compile(r"\bprint\s*\(")
          secret_patterns = [
              re.compile(r"(password|passwd|secret|api_key|token)\s*=\s*['\"][^'\"]{6,}['\"]", re.IGNORECASE),
              re.compile(r"clickhouse://[^'\"\s]+:[^'\"\s]+@", re.IGNORECASE),
              re.compile(r"rediss?://[^'\"\s]*:[^'\"\s]+@", re.IGNORECASE),
          ]

          for root in source_dirs:
              for py_file in root.rglob("*.py"):
                  text = py_file.read_text(encoding="utf-8", errors="ignore")
                  for i, line in enumerate(text.splitlines(), 1):
                      stripped = line.strip()
                      if stripped.startswith("#"):
                          continue
                      if forbidden_print.search(line):
                          errors.append(f"{py_file}:{i}: forbidden print() call; use structured JSON logger")
                      for pat in secret_patterns:
                          if pat.search(line):
                              errors.append(f"{py_file}:{i}: potential hardcoded credential/DSN")

          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("Secured logging & secret hygiene audit passed.")
          EOF

  openapi-and-doc-api-sync:
    name: OpenAPI 3.1 & Doc API Contract Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js for Spectral OpenAPI Linter
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate OpenAPI 3.1 with Spectral
        run: |
          npm install -g @stoplight/spectral-cli
          spectral lint api/openapi/openapi.yaml --ruleset .spectral.yaml

      - name: Verify OpenAPI 3.1 & .ai/doc-api.md Contract Sync
        run: |
          python - << 'EOF'
          import pathlib, sys
          import subprocess, json

          subprocess.run([sys.executable, "-m", "pip", "install", "-q", "pyyaml", "openapi-spec-validator"], check=True)
          import yaml
          from openapi_spec_validator import validate

          spec_path = pathlib.Path("api/openapi/openapi.yaml")
          doc_api_path = pathlib.Path(".ai/doc-api.md")

          if not spec_path.exists():
              sys.exit("Missing api/openapi/openapi.yaml")
          if not doc_api_path.exists():
              sys.exit("Missing .ai/doc-api.md")

          spec = yaml.safe_load(spec_path.read_text(encoding="utf-8"))
          validate(spec)

          doc_text = doc_api_path.read_text(encoding="utf-8")
          missing = [path for path in spec.get("paths", {}) if path not in doc_text]
          if missing:
              sys.exit(f"Endpoints in openapi.yaml missing from .ai/doc-api.md: {missing}")

          print(f"OpenAPI 3.1 valid and synced with .ai/doc-api.md ({len(spec.get('paths', {}))} endpoints).")
          EOF

  test-suites:
    name: Test Suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]" || pip install -e . || true
          fi

      - name: Run Unit Test Suite
        run: |
          if [ -d test/unit ] && find test/unit -name "test_*.py" | grep -q .; then
            pytest test/unit -v --tb=short
          else
            echo "No unit tests in test/unit yet (Phase 0); skipping pytest."
          fi
