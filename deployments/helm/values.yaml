replicaCount: 4

image:
  repository: ghcr.io/rag-platform/rag-trace-collector-worker
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  capabilities:
    drop:
      - ALL

# Compute-optimized node sizing (c6i.xlarge / c7g.xlarge)
resources:
  requests:
    cpu: 2000m
    memory: 1.5Gi
  limits:
    cpu: 4000m
    memory: 2.5Gi

nodeSelector: {}
tolerations: []
affinity: {}

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

worker:
  processCount: 4
  gracefulDrainTimeoutSeconds: 20.0
  logLevel: "INFO"
  telemetryHost: "0.0.0.0"
  telemetryPort: 8080
  prometheusMultiprocDir: "/tmp/prom-multiproc"
  timewheelExpirySeconds: 1.5
  timewheelTickMs: 50
  timewheelMaxOpenTraces: 25000
  batchMaxRows: 50000
  batchFlushIntervalSeconds: 2.0
  batchMaxPendingBatches: 4
  diskWalDir: "/var/spool/trace-wal"
  diskWalMaxBytes: 536870912
  diskWalDrainIntervalSeconds: 2.0

kafka:
  bootstrapServers: "kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9093"
  topic: "rag-diagnostic-traces"
  topicPartitions: 32
  groupId: "rag-trace-collector-worker"
  autoOffsetReset: "earliest"
  securityProtocol: "SASL_SSL"
  saslMechanism: "SCRAM-SHA-512"
  maxPollIntervalMs: 300000
  sessionTimeoutMs: 30000
  heartbeatIntervalMs: 3000
  maxPollRecords: 500
  ports:
    - 9092
    - 9093
    - 9094
  secretName: ""

redis:
  clusterNodes: "rag-trace-collector-worker-redis-0.rag-trace-collector-worker-redis-headless.rag-telemetry.svc.cluster.local:6379,rag-trace-collector-worker-redis-1.rag-trace-collector-worker-redis-headless.rag-telemetry.svc.cluster.local:6379,rag-trace-collector-worker-redis-2.rag-trace-collector-worker-redis-headless.rag-telemetry.svc.cluster.local:6379"
  tlsEnabled: true
  lruCapacity: 50000
  socketTimeoutSeconds: 0.5
  pipelineBatchSize: 256
  ports:
    - 6379
    - 6380
  secretName: ""

clickhouse:
  host: "clickhouse.clickhouse.svc.cluster.local"
  port: 9440
  database: "rag_traces"
  user: "trace_worker"
  tlsEnabled: true
  insertDeduplicate: true
  asyncInsert: false
  replicated: true
  clusterName: "rag_cluster"
  ports:
    - 9000
    - 9440
  secretName: ""

walVolume:
  sizeLimit: 1Gi

terminationGracePeriodSeconds: 30

probes:
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

keda:
  enabled: true
  minReplicaCount: 4
  maxReplicaCount: 16
  pollingInterval: 15
  cooldownPeriod: 300
  lagThreshold: "5000"
  activationLagThreshold: "100"
  triggerAuthentication:
    enabled: true
    name: "rag-trace-kafka-trigger-auth"

pdb:
  enabled: true
  minAvailable: 3

networkPolicy:
  enabled: true
  prometheusNamespaceSelector:
    kubernetes.io/metadata.name: monitoring

prometheusRule:
  enabled: true
  labels: {}

rollout:
  enabled: false
  prometheusAddress: "http://prometheus-k8s.monitoring.svc.cluster.local:9090"
  canary:
    steps:
      - setWeight: 10
      - pause:
          duration: 2m
      - analysis:
          templates:
            - templateName: '{{ include "rag-trace-collector-worker.fullname" . }}-canary'
          args:
            - name: canary-hash
              valueFrom:
                podTemplateHashValue: Latest
      - setWeight: 50
      - pause:
          duration: 5m
      - analysis:
          templates:
            - templateName: '{{ include "rag-trace-collector-worker.fullname" . }}-canary'
          args:
            - name: canary-hash
              valueFrom:
                podTemplateHashValue: Latest

env:
  secretName: "rag-trace-collector-worker-secret"
  WORKER_PROCESS_COUNT: "4"
  GRACEFUL_DRAIN_TIMEOUT_SECONDS: "20.0"
  WORKER_HEARTBEAT_INTERVAL_SECONDS: "2.0"
  WORKER_HEARTBEAT_TIMEOUT_SECONDS: "10.0"
  WORKER_RESPAWN_INITIAL_BACKOFF_SECONDS: "0.5"
  WORKER_RESPAWN_MAX_BACKOFF_SECONDS: "30.0"
  WORKER_MAX_RESTARTS_IN_WINDOW: "10"
  WORKER_RESTART_WINDOW_SECONDS: "60.0"
  KAFKA_BOOTSTRAP_SERVERS: "localhost:9092"
  KAFKA_TOPIC: "rag-diagnostic-traces"
  KAFKA_TOPIC_PARTITIONS: "32"
  KAFKA_GROUP_ID: "rag-trace-collector-worker"
  KAFKA_AUTO_OFFSET_RESET: "earliest"
  KAFKA_SECURITY_PROTOCOL: "PLAINTEXT"
  KAFKA_MAX_POLL_INTERVAL_MS: "300000"
  KAFKA_SESSION_TIMEOUT_MS: "30000"
  KAFKA_HEARTBEAT_INTERVAL_MS: "3000"
  KAFKA_MAX_PAYLOAD_BYTES: "1048576"
  KAFKA_MAX_POLL_RECORDS: "500"
  KAFKA_FETCH_MAX_BYTES: "16777216"
  KAFKA_MAX_PARTITION_FETCH_BYTES: "1048576"
  KAFKA_MAX_IN_FLIGHT_OFFSETS: "10000"
  KAFKA_OFFSET_COMMIT_INTERVAL_SECONDS: "1.0"
  REDIS_CLUSTER_NODES: "rag-trace-collector-worker-redis-0.rag-trace-collector-worker-redis-headless.rag-telemetry.svc.cluster.local:6379,rag-trace-collector-worker-redis-1.rag-trace-collector-worker-redis-headless.rag-telemetry.svc.cluster.local:6379,rag-trace-collector-worker-redis-2.rag-trace-collector-worker-redis-headless.rag-telemetry.svc.cluster.local:6379"
  REDIS_TLS_ENABLED: "false"
  REDIS_LRU_CAPACITY: "50000"
  REDIS_SOCKET_TIMEOUT_SECONDS: "0.5"
  REDIS_PIPELINE_BATCH_SIZE: "256"
  CLICKHOUSE_HOST: "localhost"
  CLICKHOUSE_PORT: "9000"
  CLICKHOUSE_DATABASE: "rag_traces"
  CLICKHOUSE_USER: "default"
  CLICKHOUSE_TLS_ENABLED: "false"
  CLICKHOUSE_CONNECT_TIMEOUT_SECONDS: "5.0"
  CLICKHOUSE_SEND_RECEIVE_TIMEOUT_SECONDS: "10.0"
  CLICKHOUSE_INSERT_DEDUPLICATE: "true"
  CLICKHOUSE_ASYNC_INSERT: "false"
  CLICKHOUSE_REPLICATED: "true"
  CLICKHOUSE_CLUSTER_NAME: "rag_cluster"
  TIMEWHEEL_EXPIRY_SECONDS: "1.5"
  TIMEWHEEL_TICK_MS: "50"
  TIMEWHEEL_MAX_OPEN_TRACES: "25000"
  BATCH_MAX_ROWS: "50000"
  BATCH_FLUSH_INTERVAL_SECONDS: "2.0"
  BATCH_MAX_PENDING_BATCHES: "4"
  DISK_WAL_DIR: "/var/spool/trace-wal"
  DISK_WAL_MAX_BYTES: "536870912"
  DISK_WAL_DRAIN_INTERVAL_SECONDS: "2.0"
  LOG_LEVEL: "INFO"
  TELEMETRY_HOST: "127.0.0.1"
  TELEMETRY_PORT: "8080"
  PROMETHEUS_MULTIPROC_DIR: ""
