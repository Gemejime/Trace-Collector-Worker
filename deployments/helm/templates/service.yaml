apiVersion: v1
kind: Service
metadata:
  name: {{ include "rag-trace-collector-worker.fullname" . }}
  labels:
    {{- include "rag-trace-collector-worker.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: telemetry
      protocol: TCP
      name: telemetry
  selector:
    {{- include "rag-trace-collector-worker.selectorLabels" . | nindent 4 }}
