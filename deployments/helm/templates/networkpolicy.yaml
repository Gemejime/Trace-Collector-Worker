{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rag-trace-collector-worker.fullname" . }}
  labels:
    {{- include "rag-trace-collector-worker.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rag-trace-collector-worker.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.prometheusNamespaceSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.worker.telemetryPort }}
  egress:
    # Cluster DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Apache Kafka brokers
    - ports:
        {{- range .Values.kafka.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    # Redis 7.2 Cluster
    - ports:
        {{- range .Values.redis.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    # ClickHouse native TCP
    - ports:
        {{- range .Values.clickhouse.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
{{- end }}
